[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "orsik-mobile-bridge"
version = "0.1.0"
description = "Minimal Orsik Mobile Bridge: a safe, installable Mobile-v1 surface over an unmodified official Hermes API server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["aiohttp>=3.10,<4", "prompt-toolkit==3.0.53"]

[project.scripts]
omb = "orsik_mobile_bridge.server:main"
orsik-mobile-bridge = "orsik_mobile_bridge.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["orsik_mobile_bridge*"]

[tool.setuptools.data-files]
"share/orsik-mobile-bridge" = ["install-bridge.sh"]

[dependency-groups]
dev = ["coverage==7.16.2"]

[tool.coverage.run]
source = ["orsik_mobile_bridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
