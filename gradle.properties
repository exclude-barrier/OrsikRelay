# Project-level Gradle configuration (JDK selection stays in the user-level
# ~/.gradle/gradle.properties so no machine-specific paths end up in git).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required for Compose.
android.useAndroidX=true
android.nonTransitiveRClass=true
