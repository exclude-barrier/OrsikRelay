reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "query"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
