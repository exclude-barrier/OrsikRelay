name: Android API 37 smoke test

# Issue #51 was reported on Android 17. The API 37 emulator image does not yet
# boot reliably on hosted runners, so this smoke test is kept out of the pull
# request checks and runs nightly or on demand. Move it back into android.yml
# once the image has proven stable.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-api37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  picker-api37:
    name: Photo picker smoke test (API 37)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.1.0'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk
          df -h /home/runner

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Photo picker test on an API 37 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # The SDK names this platform "android-37.0".
          api-level: '37.0'
          target: google_apis
          arch: x86_64
          disk-size: 6144M
          # Preserve the runner defaults and expose guest boot failures.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -show-kernel
          emulator-boot-timeout: 900
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.excludebarrier.orsikrelay.PhotoPickerLaunchUiTest

      - name: Upload picker test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: picker-api37-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
