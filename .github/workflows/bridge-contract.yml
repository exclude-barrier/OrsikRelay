name: Bridge contract

# Black-box Mobile-v1 contract suite (bridge-rs/contract). It starts the
# bridge as a process against a fake Hermes and checks the behaviour over
# HTTP only, so the same tests later hold the Rust bridge to the contract of
# the Python one. Not a required check until it has proven stable.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  contract-python:
    name: Contract suite against the Python bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the Python bridge from the locked graph
        working-directory: bridge
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --no-dev
      - name: Rust toolchain from rust-toolchain.toml
        working-directory: bridge-rs
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge-rs/target
          key: bridge-rs-${{ runner.os }}-${{ hashFiles('bridge-rs/Cargo.lock', 'bridge-rs/rust-toolchain.toml') }}
      - name: Contract suite
        working-directory: bridge-rs
        env:
          BRIDGE_PY: ${{ github.workspace }}/bridge/.venv/bin/python
        run: cargo test --locked -p orsik-bridge-contract

  contract-rust:
    name: Contract suite against the Rust bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install the Python bridge (store compatibility check)
        working-directory: bridge
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked --no-dev
      - name: Rust toolchain from rust-toolchain.toml
        working-directory: bridge-rs
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge-rs/target
          key: bridge-rs-${{ runner.os }}-${{ hashFiles('bridge-rs/Cargo.lock', 'bridge-rs/rust-toolchain.toml') }}
      - name: Format
        working-directory: bridge-rs
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: bridge-rs
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        working-directory: bridge-rs
        run: cargo test --locked -p orsik-mobile-bridge
      - name: Installer checks (install, check, update, rollback, checksum)
        run: |
          cargo build --locked --manifest-path bridge-rs/Cargo.toml -p orsik-mobile-bridge
          bash bridge-rs/tests/install-scripts.sh bridge-rs/target/debug/orsik-mobile-bridge
      - name: Contract suite against the Rust bridge
        working-directory: bridge-rs
        env:
          BRIDGE_PY: ${{ github.workspace }}/bridge/.venv/bin/python
        run: |
          cargo build --locked -p orsik-mobile-bridge
          BRIDGE_CMD="$PWD/target/debug/orsik-mobile-bridge" cargo test --locked -p orsik-bridge-contract

  caddy-example:
    name: Public ingress example validates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: caddy validate (official image, throw-away client CA)
        run: |
          WORK="$RUNNER_TEMP/caddy"
          mkdir -p "$WORK/logs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$WORK/ca.key" -out "$WORK/orsik-client-ca.pem" -days 1 -subj "/CN=ci only"
          docker run --rm \
            -v "$PWD/deploy/caddy/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            -v "$WORK/orsik-client-ca.pem:/etc/caddy/orsik-client-ca.pem:ro" \
            -v "$WORK/logs:/var/log/caddy" \
            caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  npm-example:
    name: Nginx Proxy Manager example validates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: nginx -t (official image, the example inside an NPM-like server block)
        run: |
          WORK="$RUNNER_TEMP/npm"
          mkdir -p "$WORK/custom_ssl"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
            -keyout "$WORK/server.key" -out "$WORK/server.pem" -days 1 -subj "/CN=ci only"
          cp "$WORK/server.pem" "$WORK/custom_ssl/orsik-client-ca.pem"
          sed 's/BRIDGE_PUBLIC_ADDRESS/172.18.0.1:9843/' deploy/npm/advanced.conf.example > "$WORK/advanced.conf"
          printf '%s\n' 'events {}' 'http {' '  server {' '    listen 443 ssl;' \
            '    ssl_certificate /etc/npm/server.pem;' '    ssl_certificate_key /etc/npm/server.key;' \
            '    include /etc/npm/advanced.conf;' '  }' '}' > "$WORK/nginx.conf"
          docker run --rm -v "$WORK:/etc/npm:ro" -v "$WORK/custom_ssl:/data/custom_ssl:ro" \
            nginx:1.31 nginx -t -c /etc/npm/nginx.conf
