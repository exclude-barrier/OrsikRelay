name: Bridge CI

# Reproducible gate for the Orsik Mobile Bridge PoC (Python). Mirrors the
# local `python -m unittest discover -s tests`. No deployment, no secrets.

on:
  push:
    branches: [ main ]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bridge/**'
      - '.github/workflows/bridge.yml'

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install bridge
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
