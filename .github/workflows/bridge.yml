name: Bridge CI

# Reproducible gate for the Orsik Mobile Bridge (Rust, bridge-rs/): the
# locked release build, the unit tests, a checksum and the binary as an
# artifact. No deployment, no secrets.

# No path filter: the job is a required status check for `main`
# (docs/release.md "Branch-Governance"), and a path-filtered required check
# never reports on PRs outside the bridge and blocks them.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  bridge:
    name: Bridge tests and reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bridge-rs/target
          key: bridge-release-${{ runner.os }}-${{ hashFiles('bridge-rs/Cargo.lock', 'bridge-rs/rust-toolchain.toml') }}
      - name: Unit tests
        run: cargo test --locked -p orsik-mobile-bridge
      - name: Release build from the locked graph
        run: cargo build --locked --release -p orsik-mobile-bridge
      - name: Checksum
        run: |
          mkdir -p dist
          cp target/release/orsik-mobile-bridge dist/
          cd dist && sha256sum orsik-mobile-bridge > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bridge-dist
          path: bridge-rs/dist
