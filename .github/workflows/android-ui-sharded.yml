name: Android UI tests (sharded trial)

# Trial of a faster layout for the required "Instrumented tests (API 36)" job
# in android.yml: three parallel emulator shards, a cached AVD snapshot and a
# Gradle cache. Runs nightly/on demand only; move it into android.yml once it
# has proven stable.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-sharded-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: Instrumented tests (API 36, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.1.0'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android/sdk/ndk
          df -h /home/runner

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis-x86_64-v1

      # A boot without saved state would make every later shard cold boot.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          force-avd-creation: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # AGP can report success with zero executed tests, so count them.
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.filter=io.github.excludebarrier.orsikrelay.ManualTestsFilter
            -Pandroid.testInstrumentationRunnerArguments.numShards=3
            -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }} &&
            python3 -c "import glob, xml.etree.ElementTree as E;
            roots=[E.parse(p).getroot() for p in glob.glob('app/build/outputs/androidTest-results/connected/**/TEST-*.xml', recursive=True)];
            n=sum(int(r.get('tests', 0)) for r in roots);
            print('Executed tests in this shard:', n);
            assert n >= 100, 'Shard ran too few tests'"

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-reports-shard-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore

  # Same name as the required check in android.yml, so the ruleset keeps
  # working unchanged once this layout moves there.
  connected:
    name: Instrumented tests (API 36)
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All shards passed
        run: test "${{ needs.shard.result }}" = success
